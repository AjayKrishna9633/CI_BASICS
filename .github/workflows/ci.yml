name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install project dependencies
        run: npm install

      - name: 4. Run automated unit tests
        run: npm test

      - name: 5. Build & package the application
        run: npm run build
